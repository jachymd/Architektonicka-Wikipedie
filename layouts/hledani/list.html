{{ define "main" }}
<h1>{{ .Title }}</h1>
<p>Hledá napříč HOW-TO, INSPIRACE a PROJEKTY — v názvech, textu i tazích.</p>

<input type="search" id="search-input" class="search-input" placeholder="Napiš hledaný výraz…" autofocus>
<div id="search-results" class="search-results"></div>

<script>
(function () {
  var indexUrl = "{{ "index.json" | relURL }}";
  var data = [];
  var allTags = {};

  fetch(indexUrl).then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    data.forEach(function (page) {
      (page.tagy || []).forEach(function (t) { allTags[t] = true; });
    });
  });

  var sectionLabels = { "how-to": "HOW-TO", "inspirace": "INSPIRACE", "projekty": "PROJEKTY" };

  function snippet(content, q) {
    var idx = content.toLowerCase().indexOf(q);
    if (idx === -1) return content.slice(0, 160) + "…";
    var start = Math.max(0, idx - 60);
    var end = Math.min(content.length, idx + q.length + 100);
    return (start > 0 ? "…" : "") + content.slice(start, end) + (end < content.length ? "…" : "");
  }

  function search(qRaw) {
    var q = qRaw.trim().toLowerCase();
    var resultsEl = document.getElementById("search-results");
    resultsEl.innerHTML = "";
    if (q.length < 2) { return; }

    var tagMatches = Object.keys(allTags).filter(function (t) {
      return t.toLowerCase().indexOf(q) !== -1;
    }).sort();

    var pageMatches = data.map(function (page) {
      var title = (page.title || "").toLowerCase();
      var content = (page.content || "").toLowerCase();
      var tagy = (page.tagy || []).map(function (t) { return t.toLowerCase(); });
      var score = 0;
      if (title === q) score += 100;
      else if (title.indexOf(q) !== -1) score += 40;
      if (tagy.indexOf(q) !== -1) score += 25;
      var contentHits = content.split(q).length - 1;
      score += Math.min(contentHits, 5) * 4;
      return { page: page, score: score };
    }).filter(function (m) { return m.score > 0; })
      .sort(function (a, b) { return b.score - a.score; });

    if (tagMatches.length === 0 && pageMatches.length === 0) {
      resultsEl.innerHTML = "<p class=\"search-empty\">Nic nenalezeno.</p>";
      return;
    }

    if (tagMatches.length > 0) {
      var tagWrap = document.createElement("div");
      tagWrap.className = "search-group";
      var h = document.createElement("h3");
      h.textContent = "Tagy";
      tagWrap.appendChild(h);
      var pills = document.createElement("div");
      pills.className = "tag-pills";
      tagMatches.forEach(function (t) {
        var a = document.createElement("a");
        a.className = "tag";
        a.href = "{{ "tagy/" | relURL }}" + t + "/";
        a.textContent = "#" + t;
        pills.appendChild(a);
      });
      tagWrap.appendChild(pills);
      resultsEl.appendChild(tagWrap);
    }

    if (pageMatches.length > 0) {
      var pageWrap = document.createElement("div");
      pageWrap.className = "search-group";
      var h2 = document.createElement("h3");
      h2.textContent = "Články";
      pageWrap.appendChild(h2);
      var list = document.createElement("ul");
      list.className = "entry-list";
      pageMatches.forEach(function (m) {
        var li = document.createElement("li");
        var sectionLabel = sectionLabels[m.page.section] || m.page.section;
        li.innerHTML = "<a href=\"" + m.page.url + "\">" + m.page.title + "</a>" +
          " <span class=\"meta\">" + sectionLabel + "</span>" +
          "<div class=\"search-snippet\">" + snippet(m.page.content || "", q) + "</div>";
        list.appendChild(li);
      });
      pageWrap.appendChild(list);
      resultsEl.appendChild(pageWrap);
    }
  }

  document.getElementById("search-input").addEventListener("input", function (e) {
    search(e.target.value);
  });
})();
</script>
{{ end }}
