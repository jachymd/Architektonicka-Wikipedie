{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

<ul class="entry-list">
  {{ range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if .Params.rok }}<span class="meta">({{ .Params.rok }})</span>{{ end }}
    {{ if .Params.tagy }}
    <span class="tags">
      {{ range .Params.tagy }}<a class="tag" href="{{ printf "tagy/%s/" . | relURL }}">#{{ . }}</a>{{ end }}
    </span>
    {{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
